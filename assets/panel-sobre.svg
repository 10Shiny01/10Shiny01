<circle cx="72" cy="122" r="7" fill="url(#orbG)" stroke="#fff" stroke-width="1.5"/><text x="92" y="128" font-family="Segoe UI, Trebuchet MS, Verdana, sans-serif" font-size="19" fill="#1d4f7a">Sou desenvolvedor e gosto de transformar ideias em projetos web completos.</text><circle cx="72" cy="168" r="7" fill="url(#orbG)" stroke="#fff" stroke-width="1.5"/><text x="92" y="174" font-family="Segoe UI, Trebuchet MS, Verdana, sans-serif" font-size="19" fill="#1d4f7a">Aprendo construindo, uma etapa de cada vez.</text><circle cx="72" cy="214" r="7" fill="url(#orbG)" stroke="#fff" stroke-width="1.5"/><text x="92" y="220" font-family="Segoe UI, Trebuchet MS, Verdana, sans-serif" font-size="19" fill="#1d4f7a">Estou aprendendo C# e C++ para criar apps.</text><circle cx="72" cy="260" r="7" fill="url(#orbG)" stroke="#fff" stroke-width="1.5"/><text x="92" y="266" font-family="Segoe UI, Trebuchet MS, Verdana, sans-serif" font-size="19" fill="#1d4f7a">Curto interfaces limpinhas, brilhantes e cheias de vida.</text><circle cx="72" cy="306" r="7" fill="url(#orbG)" stroke="#fff" stroke-width="1.5"/><text x="92" y="312" font-family="Segoe UI, Trebuchet MS, Verdana, sans-serif" font-size="19" fill="#1d4f7a">Contato: <tspan font-weight="700" fill="#0b6fd0">Tutygodoi9@gmail.com</tspan></text></g></svg>