<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f8cff"/>
      <stop offset="0.5" stop-color="#58cdff"/>
      <stop offset="0.85" stop-color="#b9f5e0"/>
      <stop offset="1" stop-color="#d6ffc9"/>
    </linearGradient>
    <radialGradient id="bub" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#d9f6ff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#7fe0ff" stop-opacity="0.18"/>
    </radialGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#fffbd0" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8af0a0"/><stop offset="1" stop-color="#34bf6f"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fd183"/><stop offset="1" stop-color="#1b8f4f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="170%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0a5a9c" flood-opacity="0.45"/>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <rect width="900" height="300" rx="24" fill="url(#sky)"/>

  <!-- sol / lens flare -->
  <circle cx="770" cy="60" r="110" fill="url(#sun)">
    <animate attributeName="r" values="100;125;100" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- nuvens à deriva -->
  <g fill="#fff" opacity="0.6" filter="url(#blur)">
    <g><ellipse cx="150" cy="50" rx="110" ry="26"/><ellipse cx="210" cy="38" rx="70" ry="24"/>
      <animateTransform attributeName="transform" type="translate" values="-40 0;60 0;-40 0" dur="28s" repeatCount="indefinite"/></g>
    <g><ellipse cx="560" cy="85" rx="130" ry="24"/><ellipse cx="620" cy="72" rx="80" ry="22"/>
      <animateTransform attributeName="transform" type="translate" values="40 0;-50 0;40 0" dur="34s" repeatCount="indefinite"/></g>
  </g>

  <!-- colinas -->
  <path d="M0 245 Q200 170 430 232 T900 215 V300 H0Z" fill="url(#hill1)"/>
  <path d="M0 268 Q260 218 540 262 T900 250 V300 H0Z" fill="url(#hill2)"/>

  <!-- flores/dentes-de-leão -->
  <g stroke="#fff" stroke-width="1.5" fill="none" opacity="0.9">
    <g transform="translate(95 232)"><line x1="0" y1="0" x2="0" y2="40" stroke="#1b8f4f" stroke-width="2"/><circle cx="0" cy="-4" r="9" fill="#fff" fill-opacity="0.7"/></g>
    <g transform="translate(830 238)"><line x1="0" y1="0" x2="0" y2="34" stroke="#1b8f4f" stroke-width="2"/><circle cx="0" cy="-4" r="8" fill="#fff" fill-opacity="0.7"/></g>
  </g>

  <!-- bolhas flutuando -->
  <g stroke="#fff" stroke-width="2" fill="url(#bub)">
    <circle cx="70" cy="200" r="42"><animate attributeName="cy" values="200;180;200" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="165" cy="110" r="22"><animate attributeName="cy" values="110;88;110" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="790" cy="120" r="52"><animate attributeName="cy" values="120;98;120" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="225" r="26"><animate attributeName="cy" values="225;205;225" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="230" r="16"><animate attributeName="cy" values="230;205;230" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="245" r="13"><animate attributeName="cy" values="245;220;245" dur="5.5s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="40" r="11"><animate attributeName="cy" values="40;24;40" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="35" cy="95" r="10"><animate attributeName="cy" values="95;75;95" dur="6.5s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="60" r="8"><animate attributeName="cy" values="60;42;60" dur="5s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#fff" opacity="0.9">
    <ellipse cx="57" cy="178" rx="15" ry="7" transform="rotate(-30 57 178)"/>
    <ellipse cx="772" cy="97" rx="19" ry="9" transform="rotate(-30 772 97)"/>
  </g>

  <!-- painel de vidro -->
  <g filter="url(#shadow)">
    <rect x="200" y="70" width="500" height="140" rx="70" fill="#fff" fill-opacity="0.28" stroke="#fff" stroke-opacity="0.95" stroke-width="3"/>
    <rect x="212" y="77" width="476" height="60" rx="30" fill="url(#gloss)"/>
  </g>
  <text x="450" y="143" text-anchor="middle" font-family="Segoe UI, Trebuchet MS, Verdana, sans-serif" font-size="58" font-weight="700" fill="#fff" stroke="#0a74c9" stroke-width="1.4" paint-order="stroke">Luiz Arthur</text>
  <text x="450" y="182" text-anchor="middle" font-family="Segoe UI, Trebuchet MS, Verdana, sans-serif" font-size="21" fill="#0b5fa5">desenvolvedor web  |  aprendendo C# e C++ para criar apps</text>
</svg>
